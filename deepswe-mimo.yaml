# DeepSWE + MiMo Code 配置
# 使用 MiMo Code (opencode) 运行 DeepSWE 测试

# Job 基本设置
job_name: deepswe-mimo-test
jobs_dir: ./deepswe-results

# Agent 配置 - 使用 opencode (MiMo Code 兼容)
agent:
  name: opencode
  model_name: openai/mimo-v2.5-pro  # 或其他 MiMo 模型
  env:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.xiaomimimo.com/v1}
  kwargs:
    opencode_config:
      experimental:
        maxMode: false  # 可以设为 true 启用 Max Mode

# 环境配置
environment:
  type: docker
  force_build: false
  delete: true

# 数据集配置
dataset:
  path: /tmp/deep-swe/tasks
  n_tasks: 10  # 先测试 10 个任务
  sample_seed: 0  # 确定性随机

# 运行设置
n_concurrent: 2  # 并发数
timeout_multiplier: 1.0
