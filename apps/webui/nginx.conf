server {
    listen 80;
    server_name _;

    # Serve the React SPA.
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the API container (compose service name: onecompany-api).
    # The rewrite strips the /api prefix so it matches Hono routes directly.
    location /api/ {
        proxy_pass http://onecompany-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering and raise timeouts so event streams work.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Generated-app previews: API dynamically proxies /preview/<projectId>/
    # to the matching per-project preview process.
    location = /preview { return 301 /preview/; }
    location /preview/ {
        proxy_pass http://onecompany-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
