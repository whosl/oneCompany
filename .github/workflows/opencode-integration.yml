# M11 acceptance: real-engine golden path (weekly gate).
# Runs on schedule + manual dispatch. continue-on-error until flake rate is low enough
# to promote to a required PR check. See handbook/acceptance/evidence/golden-path-run.md.
name: opencode-integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm -w build
      - name: Golden path to Delivered (real engine — weekly acceptance gate)
        env:
          OC_OPENCODE_INTEGRATION: "1"
          OC_LLM_API_KEY: ${{ secrets.OC_LLM_API_KEY }}
          OC_LLM_BASE_URL: ${{ secrets.OC_LLM_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter @oc/api vitest run src/integration/golden-path.test.ts
        continue-on-error: true
